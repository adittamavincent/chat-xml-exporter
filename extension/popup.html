<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat XML Exporter - Debugger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --console-bg: #030712;
      --console-border: rgba(99, 102, 241, 0.15);
      --user-tag: #3b82f6;
      --assistant-tag: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 560px;
      height: 760px;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #6b7280;
    }

    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.running {
      background-color: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.2); opacity: 1; }
    }

    .controls-wrapper {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
    }
    .btn-start:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-stop {
      background-color: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: var(--danger);
    }
    .btn-stop:hover:not(:disabled) {
      background-color: var(--danger);
      color: white;
    }

    .btn-download {
      background-color: var(--success);
      color: white;
    }
    .btn-download:hover:not(:disabled) {
      background-color: var(--success-hover);
    }

    .btn-force {
      background-color: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.28);
      color: #fbbf24;
    }
    .btn-force:hover:not(:disabled) {
      background-color: #d97706;
      color: white;
    }

    .btn:disabled {
      background-color: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.03);
      color: #475569;
      cursor: not-allowed;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .flow-hint {
      margin-bottom: 12px;
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }

    .console-wrapper {
      flex-grow: 3;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .console {
      flex-grow: 1;
      background-color: var(--console-bg);
      border: 1px solid var(--console-border);
      border-radius: 8px;
      padding: 10px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.5;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .console-line {
      display: flex;
      gap: 8px;
    }

    .console-time {
      color: #4b5563;
      flex-shrink: 0;
    }

    .console-text {
      color: #9ca3af;
      word-break: break-all;
    }

    .console-text.info { color: #a5b4fc; }
    .console-text.success { color: #34d399; }
    .console-text.warn { color: #fbbf24; }
    .console-text.error { color: #f87171; }

    .preview-wrapper {
      flex-grow: 2;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }

    .turns-list {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .turns-list::-webkit-scrollbar, .console::-webkit-scrollbar {
      width: 4px;
    }

    .turns-list::-webkit-scrollbar-thumb, .console::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
    }

    .turns-list:empty::after {
      content: 'No turns extracted yet. Run detect first, then press "Start".';
      display: block;
      padding: 20px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }

    .turn-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 11px;
    }

    .turn-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .turn-index {
      color: var(--text-muted);
      font-weight: 500;
    }

    .tag-badge {
      font-weight: 600;
      font-family: monospace;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 9px;
    }

    .tag-user {
      background-color: rgba(59, 130, 246, 0.12);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    .tag-response {
      background-color: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .turn-preview-text {
      color: var(--text-muted);
      white-space: pre-wrap;
      max-height: 48px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      line-clamp: 3;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
  </style>
</head>
<body>
  <header>
    <h1>Chat XML Exporter</h1>
    <div class="status-badge">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Connecting...</span>
    </div>
  </header>

  <div class="controls-wrapper">
    <button id="detect-btn" class="btn btn-start">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3.2-6.9"/><polyline points="21 3 21 9 15 9"/></svg>
      Detect / Restart
    </button>
    <button id="start-btn" class="btn btn-start">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Start
    </button>
    <button id="force-start-btn" class="btn btn-force" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
      Force Start
    </button>
    <button id="stop-btn" class="btn btn-stop" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
      Stop
    </button>
    <button id="download-btn" class="btn btn-download" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download XML
    </button>
  </div>

  <div class="flow-hint">
    Flow: detect dulu sampai fetch baru berhenti, lalu start scrape. Pakai force start buat potong detect yang masih jalan.
  </div>

  <div class="console-wrapper">
    <div class="section-title" style="display: flex; justify-content: space-between; align-items: center;">
      <span>Console Output</span>
      <span id="clear-btn" style="cursor: pointer; text-transform: none; font-size: 10px; font-weight: normal; color: var(--text-muted); text-decoration: underline;">Clear Log</span>
    </div>
    <div id="console" class="console">
      <div class="console-line">
        <span class="console-time">[00:00:00]</span>
        <span class="console-text success">Ready to detect. Make sure active page has conversation loaded.</span>
      </div>
    </div>
  </div>

  <div class="preview-wrapper">
    <div class="section-title" style="display: flex; justify-content: space-between;">
      <span>Extracted Turns</span>
      <span id="turns-counter" style="font-weight: normal; text-transform: none;">0 turns</span>
    </div>
    <div id="preview-list" class="turns-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
