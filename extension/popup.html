<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --user-tag: #3b82f6;
      --assistant-tag: #10b981;
    }

    body {
      width: 320px;
      margin: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 16px;
    }

    h3 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      background-color: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }

    .list-container {
      margin: 16px 0;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .list-container::-webkit-scrollbar {
      width: 6px;
    }

    .list-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    .list-container:empty::after {
      content: 'No preview available. Click Extract first.';
      display: block;
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .turn-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 12px;
    }

    .tag-badge {
      font-weight: 600;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }

    .tag-user {
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tag-response {
      background-color: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .turn-index {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <h3>Chat XML Exporter</h3>
  
  <button id="extract-btn" class="btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
    Extract & Download XML
  </button>
  
  <button id="dl-top-btn" class="btn" style="margin-top: 12px; display: none;">
    Download XML (Top)
  </button>

  <div id="preview-list" class="list-container"></div>

  <button id="dl-bottom-btn" class="btn" style="display: none;">
    Download XML (Bottom)
  </button>

  <div id="status">Ready</div>

  <script src="popup.js"></script>
</body>
</html>
